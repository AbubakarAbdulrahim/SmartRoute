name: smart_route
description: "A premium logistics platform for SmartRoute AI."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.0.3
  firebase_storage: ^12.0.1
  firebase_database: ^11.0.2
  google_generative_ai: ^0.4.0

  # Configuration
  flutter_dotenv: ^5.1.0

  # Utils & UI
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3
  geolocator: ^13.0.1
  google_maps_flutter: ^2.7.0
  intl: ^0.20.2
  lucide_icons: 0.257.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  animations: ^2.0.11
  shared_preferences: ^2.5.2
  smooth_page_indicator: ^1.2.0+1
  animated_text_kit: ^4.2.2
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0

  # Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geocoding: ^4.0.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/apple.png
    - assets/onboarding/


